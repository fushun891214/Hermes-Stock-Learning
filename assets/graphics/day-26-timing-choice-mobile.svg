<svg width="760" height="1160" viewBox="0 0 760 1160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">第二筆投入先選節奏，再談價格</title>
  <desc id="desc">手機版圖卡，比較固定時間投入與等待下跌兩種想法，提醒新手第二筆先建立做得到的節奏。</desc>
  <rect width="760" height="1160" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="704" height="1104" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="72" y="72" width="336" height="38" rx="19" fill="#D9EFE4"/>
  <text x="240" y="97" text-anchor="middle" fill="#2C8C67" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第二筆先建立節奏，不急著猜低點</text>
  <text x="72" y="154" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第二筆 ETF，</text>
  <text x="72" y="198" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先選做得到的方式</text>

  <rect x="72" y="244" width="616" height="250" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <rect x="100" y="270" width="126" height="32" rx="16" fill="#EAF5EF"/>
  <text x="163" y="292" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">固定時間投入</text>
  <text x="100" y="344" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先把日期與金額訂清楚</text>
  <text x="100" y="394" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 比較不需要每次都重新猜低點</text>
  <text x="100" y="432" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 重點是能持續，不是每次都最便宜</text>

  <circle cx="380" cy="580" r="62" fill="#FFF3DD" stroke="#E6C992" stroke-width="2"/>
  <text x="380" y="570" text-anchor="middle" fill="#9A6827" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第二筆先問</text>
  <text x="380" y="604" text-anchor="middle" fill="#9A6827" font-size="26" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">我做得到嗎？</text>

  <rect x="72" y="688" width="616" height="290" rx="24" fill="#FFFFFF" stroke="#EADBC6" stroke-width="2"/>
  <rect x="100" y="714" width="116" height="32" rx="16" fill="#FFF3DD"/>
  <text x="158" y="736" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">等下跌再買</text>
  <text x="100" y="788" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">沒有規則時，容易一直等</text>
  <text x="100" y="838" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 要先寫清楚：跌多少、等多久</text>
  <text x="100" y="876" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 若市場沒照想像走，常常更焦慮</text>
  <text x="100" y="914" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 標準一直改，就不是方法，只是等待</text>

  <rect x="72" y="1030" width="616" height="78" rx="22" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="380" y="1076" text-anchor="middle" fill="#1F6C4E" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第二筆先求節奏可重複，會比一直猜更穩。</text>
</svg>
