<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="820" rx="36" fill="#F5EEE4"/>
  <rect x="40" y="40" width="1120" height="740" rx="32" fill="#FFFDF9" stroke="#D9C7AE" stroke-width="2"/>
  <text x="76" y="110" fill="#2E261F" font-size="42" font-weight="800" font-family="'Noto Sans TC', sans-serif">恢復投入前，至少先回答這 4 題</text>
  <text x="76" y="152" fill="#6E5F52" font-size="22" font-weight="500" font-family="'Noto Sans TC', sans-serif">把「想補回來」拆開看，才不會一恢復就把自己壓得更緊。</text>

  <rect x="76" y="208" width="500" height="190" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="124" cy="262" r="18" fill="#D7B98C"/>
  <text x="117" y="269" fill="#FFFDF9" font-size="20" font-weight="800" font-family="'Noto Sans TC', sans-serif">1</text>
  <text x="154" y="258" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">我想補買雙倍，是因為條件允許，</text>
  <text x="154" y="292" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">還是因為上次沒買讓我很焦急？</text>
  <text x="154" y="336" fill="#6B5D51" font-size="18" font-weight="500" font-family="'Noto Sans TC', sans-serif">先分清楚，是生活安排變好了，還是只是想把不舒服趕快壓下去。</text>

  <rect x="624" y="208" width="500" height="190" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="672" cy="262" r="18" fill="#D7B98C"/>
  <text x="665" y="269" fill="#FFFDF9" font-size="20" font-weight="800" font-family="'Noto Sans TC', sans-serif">2</text>
  <text x="702" y="258" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">如果我只回到原本主金額，</text>
  <text x="702" y="292" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">我是真的不能接受，還是怕進度變慢？</text>
  <text x="702" y="336" fill="#6B5D51" font-size="18" font-weight="500" font-family="'Noto Sans TC', sans-serif">很多時候卡住的不是金額不夠，而是怕自己看起來落後。</text>

  <rect x="76" y="430" width="500" height="190" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="124" cy="484" r="18" fill="#D7B98C"/>
  <text x="117" y="491" fill="#FFFDF9" font-size="20" font-weight="800" font-family="'Noto Sans TC', sans-serif">3</text>
  <text x="154" y="480" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">如果這次加大金額，下個月與生活支出</text>
  <text x="154" y="514" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">還接得住嗎？</text>
  <text x="154" y="558" fill="#6B5D51" font-size="18" font-weight="500" font-family="'Noto Sans TC', sans-serif">能不能連續做，比這次看起來補得漂亮更重要。</text>

  <rect x="624" y="430" width="500" height="190" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="672" cy="484" r="18" fill="#D7B98C"/>
  <text x="665" y="491" fill="#FFFDF9" font-size="20" font-weight="800" font-family="'Noto Sans TC', sans-serif">4</text>
  <text x="702" y="480" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">我現在是不是更適合先把固定時間與</text>
  <text x="702" y="514" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">主金額穩穩接回來？</text>
  <text x="702" y="558" fill="#6B5D51" font-size="18" font-weight="500" font-family="'Noto Sans TC', sans-serif">先恢復基本節奏，通常比急著補進度更能走得久。</text>

  <rect x="76" y="668" width="1048" height="68" rx="24" fill="#E8F0EA"/>
  <text x="104" y="711" fill="#355A46" font-size="22" font-weight="700" font-family="'Noto Sans TC', sans-serif">小提醒：恢復投入最重要的不是把缺口一次補滿，而是讓下一次也還能照原本節奏繼續走。</text>
</svg>
