<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">費用低先看三件事</title>
  <desc id="desc">桌機版流程圖，提醒新手先看懂 ETF 追蹤內容、確認比較的是同類商品，再判斷自己是否只是因為費用低而心動。</desc>
  <rect width="1180" height="620" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1124" height="564" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="82" y="70" width="248" height="38" rx="19" fill="#D9EFE4"/>
  <text x="206" y="95" text-anchor="middle" fill="#2C8C67" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先看商品，再看費用</text>
  <text x="82" y="154" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">看到 ETF 費用比較低時，先確認內容、用途與比較順序</text>

  <rect x="82" y="214" width="300" height="220" rx="28" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="126" cy="258" r="22" fill="#EAF5EF"/>
  <text x="126" y="265" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="162" y="262" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看懂它在追蹤什麼</text>
  <text x="106" y="314" fill="#4A3F37" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 費用低不等於你已看懂商品內容</text>
  <text x="106" y="346" fill="#4A3F37" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先分清楚你喜歡的是內容，</text>
  <text x="106" y="376" fill="#4A3F37" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">  還是只是看起來比較便宜</text>

  <rect x="440" y="214" width="300" height="220" rx="28" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="484" cy="258" r="22" fill="#EAF5EF"/>
  <text x="484" y="265" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="520" y="262" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先確認你比較的是</text>
  <text x="520" y="292" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">同一類用途商品</text>
  <text x="464" y="338" fill="#4A3F37" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 名字很像，不代表內容與角色都一樣</text>
  <text x="464" y="368" fill="#4A3F37" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先縮小到看得懂的選項，再比成本</text>

  <rect x="798" y="214" width="300" height="220" rx="28" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="842" cy="258" r="22" fill="#EAF5EF"/>
  <text x="842" y="265" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="878" y="258" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">別把費用低，當成</text>
  <text x="878" y="288" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">唯一決定理由</text>
  <text x="822" y="334" fill="#4A3F37" font-size="17" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 費用是加分條件，不是自動適合的保證</text>
  <text x="822" y="364" fill="#4A3F37" font-size="17" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先看內容與角色，再決定值不值得買</text>

  <path d="M390 324H425" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M748 324H783" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M407 310L425 324L407 338" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M765 310L783 324L765 338" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="82" y="474" width="1016" height="42" rx="21" fill="#EAF5EF"/>
  <text x="590" y="502" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先確認商品是不是你要的，再把費用拿來做最後比較。</text>
</svg>
