<svg width="760" height="1140" viewBox="0 0 760 1140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 20 比較名單 checklist</title>
  <desc id="desc">手機版 checklist，用四個問題幫助新手縮小 ETF 比較名單，不要太早被數字條件帶走。</desc>
  <rect width="760" height="1140" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="704" height="1084" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="72" y="72" width="304" height="38" rx="19" fill="#FFF3DD"/>
  <text x="224" y="97" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把名單縮成同一題</text>
  <text x="72" y="154" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">比較 ETF 前，</text>
  <text x="72" y="198" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先用這四題整理名單</text>

  <rect x="72" y="234" width="616" height="168" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="278" fill="#231B16" font-size="25" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這幾檔 ETF，</text>
  <text x="126" y="318" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">真的都在回答同一個起步需求嗎？</text>

  <rect x="72" y="422" width="616" height="176" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="466" fill="#231B16" font-size="25" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果遮住代號，</text>
  <text x="126" y="506" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我還說得出它們在追蹤什麼、</text>
  <text x="126" y="542" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">彼此差別在哪裡嗎？</text>

  <rect x="72" y="620" width="616" height="178" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="664" fill="#231B16" font-size="25" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 哪一檔是因為適合我的安排，</text>
  <text x="126" y="704" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">哪一檔只是因為最近常看到，</text>
  <text x="126" y="740" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">所以還捨不得刪掉？</text>

  <rect x="72" y="820" width="616" height="176" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="864" fill="#231B16" font-size="25" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果最後只留 1 到 2 檔，</text>
  <text x="126" y="904" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我刪掉其他候選的理由，</text>
  <text x="126" y="940" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">講得清楚嗎？</text>

  <rect x="72" y="1028" width="616" height="48" rx="24" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="380" y="1060" text-anchor="middle" fill="#1F6C4E" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先留下同一題的候選，再看條件數字。</text>
</svg>
