<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">固定投入先有主金額，再談調整</title>
  <desc id="desc">桌機版圖卡，說明固定投入應先設定主金額，再判斷什麼情況才適合調整。</desc>
  <rect width="1200" height="540" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="484" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="294" height="34" rx="17" fill="#D9EFE4"/>
  <text x="211" y="86" text-anchor="middle" fill="#2C8C67" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把主金額定穩，再談彈性</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">固定投入不是每次重想一次，而是先有一個接得住的主金額</text>

  <rect x="64" y="186" width="306" height="236" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <rect x="92" y="212" width="112" height="30" rx="15" fill="#EAF5EF"/>
  <text x="148" y="232" text-anchor="middle" fill="#1F6C4E" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">主金額</text>
  <text x="92" y="278" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先定一個大致固定的基準</text>
  <text x="92" y="324" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 生活可負擔</text>
  <text x="92" y="356" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 下次容易直接執行</text>
  <text x="92" y="388" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 幫你少一點臨場猶豫</text>

  <circle cx="434" cy="304" r="42" fill="#FFF3DD" stroke="#E6C992" stroke-width="2"/>
  <text x="434" y="298" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先問</text>
  <text x="434" y="322" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">接得住嗎？</text>

  <rect x="500" y="186" width="300" height="236" rx="24" fill="#FFFFFF" stroke="#EADBC6" stroke-width="2"/>
  <rect x="528" y="212" width="112" height="30" rx="15" fill="#FFF3DD"/>
  <text x="584" y="232" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">可調整</text>
  <text x="528" y="278" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">來自生活條件的變化</text>
  <text x="528" y="324" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 收入或支出安排改變</text>
  <text x="528" y="356" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 原本金額太勉強或太鬆</text>
  <text x="528" y="388" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 想讓節奏更可持續</text>

  <rect x="830" y="186" width="306" height="236" rx="24" fill="#FFFFFF" stroke="#F0D6D6" stroke-width="2"/>
  <rect x="858" y="212" width="126" height="30" rx="15" fill="#FBE5E5"/>
  <text x="921" y="232" text-anchor="middle" fill="#B45757" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先別這樣調</text>
  <text x="858" y="278" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">不要讓短期情緒帶著改</text>
  <text x="858" y="324" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 漲了就臨時加大</text>
  <text x="858" y="356" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 跌了就衝動攤平</text>
  <text x="858" y="388" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 緊張就每次改規則</text>

  <rect x="64" y="452" width="1072" height="36" rx="18" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="476" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">固定投入先求規則簡單、金額接得住；先穩住主金額，之後才比較有餘裕談調整。</text>
</svg>
