<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 26 第二筆節奏 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手決定第二筆 ETF 要用固定時間投入，還是等待價格變化。</desc>
  <rect width="1200" height="560" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="504" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="286" height="34" rx="17" fill="#FFF3DD"/>
  <text x="207" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第二筆先檢查節奏，不急著抓低點</text>
  <text x="64" y="142" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第二筆投入前，先回答這四題</text>

  <rect x="64" y="188" width="504" height="124" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="238" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我是真的適合固定時間投入，還是只是因為</text>
  <text x="92" y="274" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">怕買貴，才一直想等一個更漂亮的點？</text>

  <rect x="632" y="188" width="504" height="124" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="660" y="238" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果要固定時間投入，我的日期與大約金額</text>
  <text x="660" y="274" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">是不是已經想清楚，而不是到時再臨時改？</text>

  <rect x="64" y="340" width="504" height="124" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="390" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果我想等價格變化，我寫得出清楚規則嗎：</text>
  <text x="92" y="426" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">跌多少、等多久、沒發生時怎麼辦？</text>

  <rect x="632" y="340" width="504" height="124" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="660" y="390" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 不管我選哪一種方式，這次安排會不會讓我</text>
  <text x="660" y="426" fill="#4A3F37" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">更能維持生活與後續節奏，而不是更焦慮？</text>

  <rect x="64" y="486" width="1072" height="32" rx="16" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="508" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把第二筆的節奏寫清楚，比一直想像完美價格更有幫助。</text>
</svg>
