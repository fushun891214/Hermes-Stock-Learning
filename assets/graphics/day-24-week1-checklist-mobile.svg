<svg width="760" height="1120" viewBox="0 0 760 1120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 24 第一週觀察 checklist</title>
  <desc id="desc">手機版 checklist，用四個問題幫助新手在第一次買進後的第一週穩住節奏。</desc>
  <rect width="760" height="1120" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="704" height="1064" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="72" y="72" width="318" height="38" rx="19" fill="#FFF3DD"/>
  <text x="231" y="97" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一週先觀察，不急著評分</text>
  <text x="72" y="154" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">買完第一筆後，</text>
  <text x="72" y="198" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先做這四題檢查</text>

  <rect x="72" y="240" width="616" height="146" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="292" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 商品、金額與日期，真的都有照</text>
  <text x="126" y="330" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我原本安排完成嗎？</text>

  <rect x="72" y="410" width="616" height="146" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="462" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這幾天我最在意的，是價格本身，</text>
  <text x="126" y="500" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是我開始懷疑原本理由？</text>

  <rect x="72" y="580" width="616" height="146" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="632" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這筆投入有沒有讓我的情緒、</text>
  <text x="126" y="670" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">睡眠或生活節奏明顯變亂？</text>

  <rect x="72" y="750" width="616" height="146" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="100" y="802" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 接下來第一週，我要不要替自己</text>
  <text x="126" y="840" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">固定一個查看頻率？</text>

  <rect x="72" y="930" width="616" height="30" rx="15" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="380" y="952" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把第一週走穩，再慢慢累積信心。</text>
</svg>
