<svg width="760" height="1320" viewBox="0 0 760 1320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 27 固定投入金額 checklist</title>
  <desc id="desc">手機版圖卡，整理固定投入金額卡的四個檢查問題。</desc>
  <rect width="760" height="1320" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="704" height="1264" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="72" y="72" width="240" height="38" rx="19" fill="#FFF3DD"/>
  <text x="192" y="97" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">固定投入金額卡</text>
  <text x="72" y="154" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">想改金額前，</text>
  <text x="72" y="198" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先把四題問完</text>

  <rect x="72" y="248" width="616" height="196" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="124" cy="304" r="26" fill="#EAF5EF"/>
  <text x="124" y="312" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="166" y="304" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">我的主金額，真的接得住嗎？</text>
  <text x="100" y="360" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">不是看起來積極，</text>
  <text x="100" y="396" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">而是下次還能接上。</text>

  <rect x="72" y="472" width="616" height="224" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="124" cy="528" r="26" fill="#EAF5EF"/>
  <text x="124" y="536" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="166" y="528" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">這次想改，是生活變了</text>
  <text x="166" y="564" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">還是情緒變了？</text>
  <text x="100" y="620" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先分清楚理由，</text>
  <text x="100" y="656" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">再決定要不要動金額。</text>

  <rect x="72" y="724" width="616" height="224" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="124" cy="780" r="26" fill="#EAF5EF"/>
  <text x="124" y="788" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="166" y="780" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">如果要保留彈性，</text>
  <text x="166" y="816" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">我的範圍是什麼？</text>
  <text x="100" y="872" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先訂邊界，</text>
  <text x="100" y="908" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">不要每次自由發揮。</text>

  <rect x="72" y="976" width="616" height="224" rx="24" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="124" cy="1032" r="26" fill="#EAF5EF"/>
  <text x="124" y="1040" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">4</text>
  <text x="166" y="1032" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">沒有明確理由時，</text>
  <text x="166" y="1068" fill="#231B16" font-size="28" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">我能先回到主金額嗎？</text>
  <text x="100" y="1124" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先練習穩定，</text>
  <text x="100" y="1160" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">比每次追求完美更重要。</text>
</svg>
