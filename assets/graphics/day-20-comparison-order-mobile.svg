<svg width="760" height="1160" viewBox="0 0 760 1160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">比較 ETF 先用對順序</title>
  <desc id="desc">手機版三步驟圖，提醒新手先比用途，再比追蹤內容與角色，最後才看費用與其他條件。</desc>
  <rect width="760" height="1160" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="704" height="1104" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="72" y="72" width="286" height="38" rx="19" fill="#D9EFE4"/>
  <text x="215" y="97" text-anchor="middle" fill="#2C8C67" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先排順序，再看條件</text>
  <text x="72" y="154" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">把 ETF 放進比較名單後，</text>
  <text x="72" y="198" fill="#231B16" font-size="36" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先照這三步比較</text>

  <rect x="72" y="240" width="616" height="206" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="116" cy="284" r="22" fill="#EAF5EF"/>
  <text x="116" y="291" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="152" y="288" fill="#231B16" font-size="26" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看是不是同一類用途</text>
  <text x="100" y="342" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先分清楚：你比的是核心起步，還是補充型商品</text>
  <text x="100" y="380" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 不同用途混在一起，後面數字再漂亮也容易比錯題</text>

  <path d="M380 466V506" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M364 488L380 506L396 488" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="72" y="538" width="616" height="210" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="116" cy="582" r="22" fill="#EAF5EF"/>
  <text x="116" y="589" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="152" y="586" fill="#231B16" font-size="26" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">再看追蹤內容與角色差別</text>
  <text x="100" y="640" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 說得出它在投什麼，也說得出放進安排後做什麼</text>
  <text x="100" y="678" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先理解差別，再決定誰更適合留下來</text>

  <path d="M380 768V808" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M364 790L380 808L396 790" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="72" y="840" width="616" height="212" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="116" cy="884" r="22" fill="#EAF5EF"/>
  <text x="116" y="891" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="152" y="888" fill="#231B16" font-size="26" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">最後才看費用、配息與其他條件</text>
  <text x="100" y="942" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 這些欄位適合拿來收尾，不適合太早當答案</text>
  <text x="100" y="980" fill="#4A3F37" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先把題目比對，再看哪個條件更適合你</text>

  <rect x="72" y="1074" width="616" height="44" rx="22" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="380" y="1103" text-anchor="middle" fill="#1F6C4E" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先比對題目，再比漂亮數字。</text>
</svg>
