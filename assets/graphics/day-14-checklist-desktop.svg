<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 14 高績效 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手判斷高績效 ETF 是否適合自己。</desc>
  <rect width="1180" height="620" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1124" height="564" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="82" y="70" width="228" height="38" rx="19" fill="#FFF3DD"/>
  <text x="196" y="95" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把理由寫清楚</text>
  <text x="82" y="154" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">想追高績效商品前，先用四題檢查自己</text>

  <rect x="82" y="214" width="484" height="120" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="112" y="258" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果先不看排名，我還說得出它在投什麼嗎？</text>

  <rect x="614" y="214" width="484" height="120" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="644" y="258" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這段績效是長期特性，還是剛好吃到行情？</text>

  <rect x="82" y="362" width="484" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="112" y="406" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果它之後回檔、不再排前面，</text>
  <text x="138" y="442" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我會不會立刻懷疑原本決定？</text>

  <rect x="614" y="362" width="484" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="644" y="406" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這筆配置放進去，會不會擠到</text>
  <text x="670" y="442" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我原本較穩的投資安排？</text>

  <rect x="82" y="532" width="1016" height="42" rx="21" fill="#EAF5EF"/>
  <text x="590" y="560" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先看懂自己為什麼想買，再決定要不要跟著高績效走。</text>
</svg>
