<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 20 比較名單 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手縮小 ETF 比較名單，不要太早被數字條件帶走。</desc>
  <rect width="1200" height="560" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="504" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="300" height="34" rx="17" fill="#FFF3DD"/>
  <text x="214" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把名單縮成同一題</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">比較 ETF 前，先用這四題整理名單</text>

  <rect x="64" y="184" width="500" height="122" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="232" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這幾檔 ETF，真的都在回答同一個起步需求嗎？</text>

  <rect x="636" y="184" width="500" height="122" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="228" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果遮住代號，我還說得出它們</text>
  <text x="690" y="262" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">在追蹤什麼、差別在哪裡嗎？</text>

  <rect x="64" y="330" width="500" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="374" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 哪一檔是因為適合我的安排，</text>
  <text x="118" y="408" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">哪一檔只是因為最近常看到，</text>
  <text x="118" y="440" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">所以還捨不得刪掉？</text>

  <rect x="636" y="330" width="500" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="374" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果最後只留 1 到 2 檔，我刪掉</text>
  <text x="690" y="408" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">其他候選的理由，講得清楚嗎？</text>

  <rect x="64" y="490" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="513" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先留下真正同類的候選，再比較條件與數字。</text>
</svg>
