<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 21 買前確認 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手在第一次買進 ETF 前，整理理由、角色與投入節奏。</desc>
  <rect width="1200" height="560" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="504" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="286" height="34" rx="17" fill="#FFF3DD"/>
  <text x="207" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">開始前，先把理由寫好</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第一次買進前，先用這四題確認</text>

  <rect x="64" y="184" width="500" height="126" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="232" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我最後留下的這一檔，主要在投什麼？</text>
  <text x="118" y="266" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">它在我的安排裡扮演什麼角色？</text>

  <rect x="636" y="184" width="500" height="126" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="228" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果有人問我為什麼選它，我說得出</text>
  <text x="690" y="262" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">一個不是「因為最後剩它」的理由嗎？</text>

  <rect x="64" y="334" width="500" height="144" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="378" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果明天市場波動，我會先回頭看</text>
  <text x="118" y="412" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">自己的持有理由，還是立刻被別人的</text>
  <text x="118" y="444" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">說法帶走？</text>

  <rect x="636" y="334" width="500" height="144" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="378" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我現在的資金安排與投入節奏，真的</text>
  <text x="690" y="412" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">接得住這次開始嗎？</text>

  <rect x="64" y="490" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="513" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">買進前先寫好自己的理由，之後比較不容易被外面的聲音帶著走。</text>
</svg>
