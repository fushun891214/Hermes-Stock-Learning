<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 24 第一週觀察 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手在第一次買進後的第一週穩住節奏。</desc>
  <rect width="1200" height="560" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="504" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="304" height="34" rx="17" fill="#FFF3DD"/>
  <text x="216" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一週先觀察，不急著評分</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第一次買完後，先用這四題檢查自己的節奏</text>

  <rect x="64" y="188" width="512" height="118" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="96" y="236" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 商品、金額與日期，真的都有照</text>
  <text x="122" y="272" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我原本安排完成嗎？</text>

  <rect x="624" y="188" width="512" height="118" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="656" y="236" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這幾天我最在意的，是價格本身，</text>
  <text x="682" y="272" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是我開始懷疑原本理由？</text>

  <rect x="64" y="328" width="512" height="118" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="96" y="376" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這筆投入有沒有讓我的情緒、</text>
  <text x="122" y="412" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">睡眠或生活節奏明顯變亂？</text>

  <rect x="624" y="328" width="512" height="118" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="656" y="376" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 接下來第一週，我要不要替自己</text>
  <text x="682" y="412" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">固定一個查看頻率？</text>

  <rect x="64" y="470" width="1072" height="38" rx="19" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="495" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一週先學會穩穩持有，比急著證明自己選得對更重要。</text>
</svg>
