<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 18 分散 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手判斷自己增加 ETF 檔數時，到底是在分散風險，還是在分散猶豫。</desc>
  <rect width="1200" height="640" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="584" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="286" height="34" rx="17" fill="#FFF3DD"/>
  <text x="207" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把增加理由寫清楚</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">想多買幾檔 ETF 前，先用這四題檢查自己</text>

  <rect x="64" y="184" width="500" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="230" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果遮住代號，我還說得出</text>
  <text x="118" y="266" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">每一檔在投什麼、差別在哪裡嗎？</text>

  <rect x="636" y="184" width="500" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="230" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我增加檔數，是因為用途不同，</text>
  <text x="690" y="266" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是只是怕自己只買一檔會選錯？</text>

  <rect x="64" y="352" width="500" height="156" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="92" y="398" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果少掉其中一檔，我的安排</text>
  <text x="118" y="434" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">是真的少一個角色，還是其實差不多？</text>

  <rect x="636" y="352" width="500" height="156" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="664" y="398" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我現在是在分散風險，</text>
  <text x="690" y="434" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是在分散自己的猶豫與不安？</text>

  <rect x="64" y="540" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="563" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">當你先講得出每一檔的角色，再增加商品，才比較像真的在分散。</text>
</svg>
