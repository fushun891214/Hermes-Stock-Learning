<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">第一次投入金額先看三件事</title>
  <desc id="desc">桌機版圖卡，提醒新手第一次買 ETF 前，先確認資金來源、心理壓力與後續投入空間。</desc>
  <rect width="1200" height="520" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="464" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="284" height="34" rx="17" fill="#D9EFE4"/>
  <text x="206" y="86" text-anchor="middle" fill="#2C8C67" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先安排節奏，不是先比膽量</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第一次買 ETF 前，先用這三件事決定起步金額</text>

  <rect x="64" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="108" cy="226" r="20" fill="#EAF5EF"/>
  <text x="108" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="140" y="230" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看：這是不是已準備好的投資錢</text>
  <text x="92" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 不是近期生活費，也不是緊急時</text>
  <text x="108" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">很可能馬上要拿回來的錢</text>
  <text x="92" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 買之前先確定，生活安排不會</text>
  <text x="108" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">因為這筆投入被打亂</text>

  <path d="M406 304H470" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M448 288L470 304L448 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="484" cy="226" r="20" fill="#EAF5EF"/>
  <text x="484" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="516" y="230" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">再看：這個金額會不會讓你太緊張</text>
  <text x="468" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 短期波動來時，你還能不能維持</text>
  <text x="484" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">原本的平常心與持有理由</text>
  <text x="468" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 如果會讓你整天盯盤，它通常就</text>
  <text x="484" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">不是理想的起步金額</text>

  <path d="M782 304H846" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M824 288L846 304L824 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="860" cy="226" r="20" fill="#EAF5EF"/>
  <text x="860" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="892" y="228" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">最後看：之後還有沒有</text>
  <text x="892" y="256" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">繼續投入空間</text>
  <text x="844" y="304" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 第一次開始後，還能不能照原本</text>
  <text x="860" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">節奏持續投入與調整</text>
  <text x="844" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 留下彈性，通常比一次放到滿更</text>
  <text x="860" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">適合新手起步</text>

  <rect x="64" y="442" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">好的起步金額，重點不是看起來夠大，而是讓你開始後還站得穩。</text>
</svg>
