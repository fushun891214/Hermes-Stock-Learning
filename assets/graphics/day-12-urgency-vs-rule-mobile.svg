<svg width="760" height="980" viewBox="0 0 760 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">有規則研究與追熱氣氛比較圖</title>
  <desc id="desc">比較先看懂再決定與看到大家都在講就跟進的差異。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F1E7"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="760" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8A6A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="760" height="980" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="704" height="924" rx="30" fill="#FFFCF7" stroke="#E9DCCB" filter="url(#shadow)"/>

  <text x="68" y="98" fill="#2C8C67" font-size="24" font-weight="800">先研究再決定</text>
  <text x="68" y="138" fill="#231B16" font-size="34" font-weight="800">先看懂，再決定要不要出手</text>
  <rect x="68" y="164" width="624" height="238" rx="24" fill="#EAF6EF" stroke="#CAE6D8"/>
  <text x="100" y="216" fill="#40342D" font-size="25" font-weight="700">・先確認它在投什麼、風險從哪裡來</text>
  <text x="100" y="262" fill="#40342D" font-size="25" font-weight="700">・先想好比例，不讓熱門題材擠走主計畫</text>
  <text x="100" y="308" fill="#40342D" font-size="25" font-weight="700">・熱度退掉時，也知道自己為什麼留著</text>
  <rect x="98" y="334" width="564" height="44" rx="22" fill="#D7F0E4"/>
  <text x="126" y="363" fill="#216D50" font-size="22" font-weight="800">結果：就算不立刻買，也比較守得住節奏</text>

  <path d="M380 430 V505" stroke="#D9C39F" stroke-width="10" stroke-linecap="round"/>
  <path d="M350 480 L380 515 L410 480" fill="none" stroke="#D9C39F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="68" y="582" fill="#B66B40" font-size="24" font-weight="800">追熱氣氛</text>
  <text x="68" y="622" fill="#231B16" font-size="34" font-weight="800">看到大家都在講，就怕自己錯過</text>
  <rect x="68" y="648" width="624" height="224" rx="24" fill="#FFF4EC" stroke="#F0D7C8"/>
  <text x="100" y="700" fill="#40342D" font-size="25" font-weight="700">・還沒有確認商品，就先擔心去不成</text>
  <text x="100" y="746" fill="#40342D" font-size="25" font-weight="700">・漲時怕買不到，跌時又開始後悔</text>
  <text x="100" y="792" fill="#40342D" font-size="25" font-weight="700">・熱度一退，就容易只剩情緒和慌張</text>
  <rect x="98" y="818" width="564" height="44" rx="22" fill="#FDE6D8"/>
  <text x="126" y="847" fill="#B66B40" font-size="22" font-weight="800">結果：買進很快，但更容易越看越慌</text>

  <rect x="68" y="900" width="624" height="34" rx="17" fill="#FFF1CC"/>
  <text x="86" y="923" fill="#8F6627" font-size="20" font-weight="800">真正該問的不是它有多熱，而是你知道自己為什麼進、為什麼留。</text>
</svg>
