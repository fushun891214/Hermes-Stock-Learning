<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 27 固定投入金額 checklist</title>
  <desc id="desc">桌機版圖卡，整理固定投入金額卡的四個檢查問題。</desc>
  <rect width="1200" height="540" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="484" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="220" height="34" rx="17" fill="#FFF3DD"/>
  <text x="174" y="86" text-anchor="middle" fill="#9A6827" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">固定投入金額卡</text>
  <text x="64" y="138" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">每次想改金額前，先把這四題問完</text>

  <rect x="64" y="182" width="500" height="122" rx="22" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="104" cy="224" r="22" fill="#EAF5EF"/>
  <text x="104" y="231" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="140" y="220" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">我的主金額，是真的接得住嗎？</text>
  <text x="140" y="254" fill="#4A3F37" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">不是看起來積極，而是下次還能穩穩接上。</text>

  <rect x="636" y="182" width="500" height="122" rx="22" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="676" cy="224" r="22" fill="#EAF5EF"/>
  <text x="676" y="231" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="712" y="220" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">這次想改，是生活變了還是情緒變了？</text>
  <text x="712" y="254" fill="#4A3F37" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先分清楚理由，再決定要不要動金額。</text>

  <rect x="64" y="330" width="500" height="122" rx="22" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="104" cy="372" r="22" fill="#EAF5EF"/>
  <text x="104" y="379" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="140" y="368" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">如果要保留彈性，我的範圍是什麼？</text>
  <text x="140" y="402" fill="#4A3F37" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先訂邊界，避免每次都臨時自由發揮。</text>

  <rect x="636" y="330" width="500" height="122" rx="22" fill="#FFFFFF" stroke="#D4E7DB" stroke-width="2"/>
  <circle cx="676" cy="372" r="22" fill="#EAF5EF"/>
  <text x="676" y="379" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">4</text>
  <text x="712" y="368" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">沒有明確理由時，我能先回到主金額嗎？</text>
  <text x="712" y="402" fill="#4A3F37" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">先練習穩定，比每次都追求完美更重要。</text>

  <rect x="64" y="470" width="1072" height="18" rx="9" fill="#EAF5EF"/>
</svg>
