<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F5EEE4"/>
  <rect x="40" y="40" width="1120" height="680" rx="32" fill="#FFFDF9" stroke="#D9C7AE" stroke-width="2"/>
  <text x="76" y="110" fill="#2E261F" font-size="42" font-weight="800" font-family="'Noto Sans TC', sans-serif">暫停一次前，至少先回答這 4 題</text>
  <text x="76" y="152" fill="#6E5F52" font-size="22" font-weight="500" font-family="'Noto Sans TC', sans-serif">把這次停下來的理由寫清楚，才能避免固定投入越停越模糊。</text>

  <rect x="76" y="210" width="1048" height="92" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="126" cy="256" r="20" fill="#D7B98C"/>
  <text x="118" y="264" fill="#FFFDF9" font-size="22" font-weight="800" font-family="'Noto Sans TC', sans-serif">1</text>
  <text x="160" y="248" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">我這次想停，是生活壓力，還是市場情緒？</text>
  <text x="160" y="282" fill="#6B5D51" font-size="20" font-weight="500" font-family="'Noto Sans TC', sans-serif">先分清楚來源，後面才知道該調的是生活安排，還是自己的情緒。</text>

  <rect x="76" y="322" width="1048" height="92" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="126" cy="368" r="20" fill="#D7B98C"/>
  <text x="118" y="376" fill="#FFFDF9" font-size="22" font-weight="800" font-family="'Noto Sans TC', sans-serif">2</text>
  <text x="160" y="360" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">這次先停，會讓生活更穩，還是只是暫時逃開不安？</text>
  <text x="160" y="394" fill="#6B5D51" font-size="20" font-weight="500" font-family="'Noto Sans TC', sans-serif">如果停下來只是讓你不用面對波動，那通常不是真正的整理。</text>

  <rect x="76" y="434" width="1048" height="92" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="126" cy="480" r="20" fill="#D7B98C"/>
  <text x="118" y="488" fill="#FFFDF9" font-size="22" font-weight="800" font-family="'Noto Sans TC', sans-serif">3</text>
  <text x="160" y="472" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">我打算停多久？下一次重新檢查安排的時間點是什麼？</text>
  <text x="160" y="506" fill="#6B5D51" font-size="20" font-weight="500" font-family="'Noto Sans TC', sans-serif">一次暫停可以，但最好同時保留一個回來檢查的節點。</text>

  <rect x="76" y="546" width="1048" height="92" rx="24" fill="#FAF2E8" stroke="#E6D6C2" stroke-width="2"/>
  <circle cx="126" cy="592" r="20" fill="#D7B98C"/>
  <text x="118" y="600" fill="#FFFDF9" font-size="22" font-weight="800" font-family="'Noto Sans TC', sans-serif">4</text>
  <text x="160" y="584" fill="#3F332C" font-size="24" font-weight="700" font-family="'Noto Sans TC', sans-serif">如果我最近常常想停，是不是主金額或頻率本來就太勉強？</text>
  <text x="160" y="618" fill="#6B5D51" font-size="20" font-weight="500" font-family="'Noto Sans TC', sans-serif">常常撐不住時，優先檢查節奏，而不是只怪自己不夠有紀律。</text>

  <rect x="76" y="660" width="1048" height="34" rx="17" fill="#E8F0EA"/>
  <text x="96" y="683" fill="#355A46" font-size="20" font-weight="700" font-family="'Noto Sans TC', sans-serif">小提醒：固定投入追求的是長期接得住，不是每一輪都硬撐過去。</text>
</svg>
