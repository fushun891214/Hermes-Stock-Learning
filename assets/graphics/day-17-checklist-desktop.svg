<svg width="1180" height="760" viewBox="0 0 1180 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 17 名稱相似 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手判斷名字很像的 ETF 是否真的適合放在一起比較。</desc>
  <rect width="1180" height="760" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1124" height="704" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="82" y="70" width="286" height="38" rx="19" fill="#FFF3DD"/>
  <text x="225" y="95" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把比較理由寫清楚</text>
  <text x="82" y="154" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">想因為名字很像就選 ETF 前，先用這四題檢查自己</text>

  <rect x="82" y="214" width="470" height="160" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="114" y="262" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果遮住名稱，我還說得出</text>
  <text x="140" y="300" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">它們各自在投什麼嗎？</text>

  <rect x="628" y="214" width="470" height="160" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="660" y="262" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我把它們放在一起比，是因為</text>
  <text x="686" y="300" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">用途真的接近，還是只是關鍵字像？</text>

  <rect x="82" y="410" width="470" height="176" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="114" y="458" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果先拿掉費用、規模和人氣，</text>
  <text x="140" y="496" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">我還能說出它們最大的差別嗎？</text>

  <rect x="628" y="410" width="470" height="176" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="660" y="458" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果我只剩「名字很像」這個理由，</text>
  <text x="686" y="496" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">是不是其實還少了一步理解？</text>

  <rect x="82" y="640" width="1016" height="42" rx="21" fill="#EAF5EF"/>
  <text x="590" y="668" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先看懂用途差別，再回頭比費用、規模或人氣。</text>
</svg>
