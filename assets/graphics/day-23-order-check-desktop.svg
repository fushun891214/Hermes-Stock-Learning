<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">第一次下單前先確認三件事</title>
  <desc id="desc">桌機版圖卡，提醒新手第一次買 ETF 前，先確認商品、金額與下單節奏。</desc>
  <rect width="1200" height="520" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="464" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="292" height="34" rx="17" fill="#D9EFE4"/>
  <text x="210" y="86" text-anchor="middle" fill="#2C8C67" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先確認，再送出第一筆</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">第一次買 ETF 前，先用這三步確認下單內容</text>

  <rect x="64" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="108" cy="226" r="20" fill="#EAF5EF"/>
  <text x="108" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="140" y="230" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看：商品是不是原本那一檔</text>
  <text x="92" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 代號、名稱與你筆記裡的候選</text>
  <text x="108" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">商品，要重新對一次</text>
  <text x="92" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 名字像、不代表就是同一檔，</text>
  <text x="108" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">第一次更要慢一點確認</text>

  <path d="M406 304H470" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M448 288L470 304L448 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="484" cy="226" r="20" fill="#EAF5EF"/>
  <text x="484" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="516" y="230" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">再看：數量與總金額有沒有超出安排</text>
  <text x="468" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先算一次，確認還在你原本</text>
  <text x="484" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">決定好的起步範圍內</text>
  <text x="468" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 不要因為怕錯過，就臨時把</text>
  <text x="484" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">原本金額越改越大</text>

  <path d="M782 304H846" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M824 288L846 304L824 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="860" cy="226" r="20" fill="#EAF5EF"/>
  <text x="860" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="892" y="228" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">最後看：下單方式有沒有</text>
  <text x="892" y="256" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">幫你保留冷靜</text>
  <text x="844" y="304" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 送出前再看一次商品、金額與</text>
  <text x="860" y="336" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">內容，不要只求趕快成交</text>
  <text x="844" y="372" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 第一次開始，流程清楚比速度</text>
  <text x="860" y="404" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">更重要</text>

  <rect x="64" y="442" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一次下單不是比快，是把「先確認再送出」的習慣建立起來。</text>
</svg>
