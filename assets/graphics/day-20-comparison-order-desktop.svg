<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">比較 ETF 先用對順序</title>
  <desc id="desc">桌機版三步驟圖，提醒新手先比用途，再比追蹤內容與角色，最後才看費用與其他條件。</desc>
  <rect width="1200" height="520" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="464" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="246" height="34" rx="17" fill="#D9EFE4"/>
  <text x="187" y="86" text-anchor="middle" fill="#2C8C67" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先排順序，再看條件</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">把 ETF 放進比較名單後，先照這三步比較</text>

  <rect x="64" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="108" cy="226" r="20" fill="#EAF5EF"/>
  <text x="108" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="140" y="230" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看是不是同一類用途</text>
  <text x="92" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先分清楚：你比的是核心起步，</text>
  <text x="108" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是補充型商品</text>
  <text x="92" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 不同用途混在一起，數字再漂亮</text>
  <text x="108" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">也容易比錯題</text>

  <path d="M406 304H470" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M448 288L470 304L448 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="484" cy="226" r="20" fill="#EAF5EF"/>
  <text x="484" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="516" y="230" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">再看追蹤內容與角色差別</text>
  <text x="468" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 說得出它在投什麼，也說得出</text>
  <text x="484" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">放進安排後在做什麼</text>
  <text x="468" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先理解差別，再決定誰更適合</text>
  <text x="484" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">留在最後名單</text>

  <path d="M782 304H846" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M824 288L846 304L824 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="184" width="320" height="238" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="860" cy="226" r="20" fill="#EAF5EF"/>
  <text x="860" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="892" y="230" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">最後才看費用、配息</text>
  <text x="892" y="260" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">與其他條件</text>
  <text x="844" y="304" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 這些欄位適合收尾，不適合太早</text>
  <text x="860" y="336" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">直接拿來當答案</text>
  <text x="844" y="372" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先把題目比對，再看哪個條件</text>
  <text x="860" y="404" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">更適合你</text>

  <rect x="64" y="442" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先比較是不是同一題，再比較哪個數字比較好看。</text>
</svg>
