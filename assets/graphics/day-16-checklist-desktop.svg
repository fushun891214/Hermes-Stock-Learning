<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Day 16 ETF 費用 checklist</title>
  <desc id="desc">桌機版 checklist，用四個問題幫助新手判斷費用較低的 ETF 是否真的適合自己。</desc>
  <rect width="1180" height="620" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1124" height="564" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="82" y="70" width="228" height="38" rx="19" fill="#FFF3DD"/>
  <text x="196" y="95" text-anchor="middle" fill="#9A6827" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先把比較順序寫清楚</text>
  <text x="82" y="154" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">想因為費用低就買 ETF 前，先用四題檢查自己</text>

  <rect x="82" y="214" width="484" height="120" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="112" y="258" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果先遮住費用，我還說得出它在投什麼嗎？</text>

  <rect x="614" y="214" width="484" height="120" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="644" y="258" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 我是在比同類選項，還是只想找最便宜的一檔？</text>

  <rect x="82" y="362" width="484" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="112" y="406" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 這幾檔商品放進去後，角色真的一樣嗎？</text>
  <text x="138" y="442" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">還是只是名字看起來很像？</text>

  <rect x="614" y="362" width="484" height="140" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <text x="644" y="406" fill="#231B16" font-size="24" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">□ 如果我最後只剩「它最便宜」，</text>
  <text x="670" y="442" fill="#4A3F37" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">是不是還少了一步理解商品本身？</text>

  <rect x="82" y="532" width="1016" height="42" rx="21" fill="#EAF5EF"/>
  <text x="590" y="560" text-anchor="middle" fill="#1F6C4E" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">先確認商品適不適合，再讓費用幫你做最後比較。</text>
</svg>
