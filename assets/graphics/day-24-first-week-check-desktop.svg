<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">買完第一週先看三件事</title>
  <desc id="desc">桌機版圖卡，提醒新手第一次買完 ETF 後，先確認安排、波動承受度與觀察節奏。</desc>
  <rect width="1200" height="520" rx="36" fill="#FFF8F1"/>
  <rect x="28" y="28" width="1144" height="464" rx="30" fill="#FFFCF8" stroke="#E8DCC9" stroke-width="2"/>

  <rect x="64" y="64" width="308" height="34" rx="17" fill="#D9EFE4"/>
  <text x="218" y="86" text-anchor="middle" fill="#2C8C67" font-size="18" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一次持有，先穩住節奏</text>
  <text x="64" y="140" fill="#231B16" font-size="34" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">買完第一週，不是先看輸贏，而是先看這三件事</text>

  <rect x="64" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="108" cy="226" r="20" fill="#EAF5EF"/>
  <text x="108" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">1</text>
  <text x="140" y="230" fill="#231B16" font-size="23" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">先看：有沒有照原本安排買進</text>
  <text x="92" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 商品、金額與日期，要和你原本</text>
  <text x="108" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">的起步計畫對得起來</text>
  <text x="92" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 幾天的漲跌，先不要急著推翻</text>
  <text x="108" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">你原本選它的理由</text>

  <path d="M406 304H470" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M448 288L470 304L448 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="440" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="484" cy="226" r="20" fill="#EAF5EF"/>
  <text x="484" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">2</text>
  <text x="516" y="230" fill="#231B16" font-size="22" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">再看：波動有沒有超出你能承受的範圍</text>
  <text x="468" y="284" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 想多看幾次很正常，不代表一定</text>
  <text x="484" y="316" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">有問題或需要立刻動作</text>
  <text x="468" y="352" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 如果已經影響睡眠與情緒，才更</text>
  <text x="484" y="384" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">值得回頭檢查金額安排</text>

  <path d="M782 304H846" stroke="#D3B58A" stroke-width="8" stroke-linecap="round"/>
  <path d="M824 288L846 304L824 320" stroke="#D3B58A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="184" width="320" height="236" rx="24" fill="#FFFFFF" stroke="#E8DCC9" stroke-width="2"/>
  <circle cx="860" cy="226" r="20" fill="#EAF5EF"/>
  <text x="860" y="233" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">3</text>
  <text x="892" y="228" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">最後看：你的觀察方式有沒有</text>
  <text x="892" y="256" fill="#231B16" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="800">把你拉回長一點的節奏</text>
  <text x="844" y="304" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 先記錄理由、感受與查看頻率，</text>
  <text x="860" y="336" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">不要只追著當下漲跌跑</text>
  <text x="844" y="372" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">• 第一週先把流程走順，比急著做</text>
  <text x="860" y="404" fill="#4A3F37" font-size="21" font-family="'Noto Sans TC', 'PingFang TC', sans-serif">第二個動作更重要</text>

  <rect x="64" y="442" width="1072" height="34" rx="17" fill="#EAF5EF" stroke="#CFE7DA" stroke-width="2"/>
  <text x="600" y="465" text-anchor="middle" fill="#1F6C4E" font-size="20" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="700">第一週先穩住自己，通常比立刻判斷這筆買進成不成功更有幫助。</text>
</svg>
