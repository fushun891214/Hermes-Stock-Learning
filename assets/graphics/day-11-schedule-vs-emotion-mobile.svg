<svg width="760" height="980" viewBox="0 0 760 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">固定檢查與情緒重看比較圖</title>
  <desc id="desc">比較固定節奏檢查與市場一動就重看的差異。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F1E7"/>
      <stop offset="1" stop-color="#FFFDF8"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="760" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8A6A43" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="760" height="980" rx="38" fill="url(#bg)"/>
  <rect x="28" y="28" width="704" height="924" rx="30" fill="#FFFCF7" stroke="#E9DCCB" filter="url(#shadow)"/>

  <text x="68" y="98" fill="#2C8C67" font-size="24" font-weight="800">固定檢查</text>
  <text x="68" y="138" fill="#231B16" font-size="34" font-weight="800">先看節奏，再看動作</text>
  <rect x="68" y="164" width="624" height="238" rx="24" fill="#EAF6EF" stroke="#CAE6D8"/>
  <text x="100" y="216" fill="#40342D" font-size="25" font-weight="700">・到了每月或每季的回看才整理</text>
  <text x="100" y="262" fill="#40342D" font-size="25" font-weight="700">・先問資金、商品理解、規則有沒有變</text>
  <text x="100" y="308" fill="#40342D" font-size="25" font-weight="700">・沒有明顯改變，就不用小波動亂調整</text>
  <rect x="98" y="334" width="564" height="44" rx="22" fill="#D7F0E4"/>
  <text x="126" y="363" fill="#216D50" font-size="22" font-weight="800">結果：比較守得住原本計畫</text>

  <path d="M380 430 V505" stroke="#D9C39F" stroke-width="10" stroke-linecap="round"/>
  <path d="M350 480 L380 515 L410 480" fill="none" stroke="#D9C39F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="68" y="582" fill="#B66B40" font-size="24" font-weight="800">情緒重看</text>
  <text x="68" y="622" fill="#231B16" font-size="34" font-weight="800">市場一動，就急著重算</text>
  <rect x="68" y="648" width="624" height="224" rx="24" fill="#FFF4EC" stroke="#F0D7C8"/>
  <text x="100" y="700" fill="#40342D" font-size="25" font-weight="700">・漲跌、新聞、群組一來就打開帳戶</text>
  <text x="100" y="746" fill="#40342D" font-size="25" font-weight="700">・還沒看清楚條件有沒有變，就想先改</text>
  <text x="100" y="792" fill="#40342D" font-size="25" font-weight="700">・每次都像重新再做一次決定</text>
  <rect x="98" y="818" width="564" height="44" rx="22" fill="#FDE6D8"/>
  <text x="126" y="847" fill="#B66B40" font-size="22" font-weight="800">結果：看很多次，卻更容易越看越亂</text>

  <rect x="68" y="900" width="624" height="34" rx="17" fill="#FFF1CC"/>
  <text x="98" y="923" fill="#8F6627" font-size="20" font-weight="800">先問「是不是到了該檢查的時間」，再看今天波動。</text>
</svg>
